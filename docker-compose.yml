services:
  db:
    image: postgres:15-alpine
    container_name: db_booking
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "${DB_PORT}:5432"
    networks:
      - booking-network

  redis:
    image: redis:7-alpine
    container_name: redis_booking
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - booking-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_booking
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - booking-network
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: web_booking
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - booking-network
    depends_on:
      - app

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  booking-network:
    driver: bridge